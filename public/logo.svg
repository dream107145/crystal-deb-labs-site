<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Crystal Dev Labs">
  <defs>
    <linearGradient id="facetLeft" x1="32" y1="8" x2="14" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#6B46C1"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="32" y1="8" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="facetLowerLeft" x1="14" y1="30" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B46C1"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="facetLowerRight" x1="50" y1="30" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="tableFacet" x1="20" y1="8" x2="44" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="32" cy="26" r="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6B46C1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient glow (transparent background) -->
  <ellipse cx="32" cy="32" rx="22" ry="24" fill="url(#innerGlow)" opacity="0.6"/>

  <!-- Gem body -->
  <g filter="url(#softGlow)">
    <!-- Upper facets -->
    <path d="M32 8 L14 30 L32 30 Z" fill="url(#facetLeft)"/>
    <path d="M32 8 L50 30 L32 30 Z" fill="url(#facetRight)"/>

    <!-- Lower facets -->
    <path d="M14 30 L32 56 L32 30 Z" fill="url(#facetLowerLeft)"/>
    <path d="M50 30 L32 56 L32 30 Z" fill="url(#facetLowerRight)"/>

    <!-- Table (top crown) -->
    <path d="M32 8 L22 18 L32 22 L42 18 Z" fill="url(#tableFacet)"/>

    <!-- Outer edge -->
    <path
      d="M32 8 L50 30 L32 56 L14 30 Z"
      stroke="url(#facetRight)"
      stroke-width="1.1"
      stroke-linejoin="round"
    />
  </g>

  <!-- Facet lines -->
  <path d="M32 8 L32 56 M14 30 L50 30" stroke="rgba(255,255,255,0.28)" stroke-width="0.75"/>
  <path d="M22 18 L42 18" stroke="rgba(255,255,255,0.4)" stroke-width="0.6"/>

  <!-- Specular highlights -->
  <path d="M18 24 L24 18 L28 26 Z" fill="rgba(255,255,255,0.22)"/>
  <circle cx="38" cy="20" r="1.2" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="26" cy="38" r="0.8" fill="#00F5FF" opacity="0.7"/>
</svg>
